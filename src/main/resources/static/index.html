<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index HTML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <form id="userForm">
        <h1>Register </h1>

        <label for="name">Name:*</label>
        <input type="text" id="name" class="nameput" placeholder="Please enter your name:">

        <label for="email">Email:*</label>
        <input type="email" id="email" class="emailput" placeholder="motsei@gmail.com">

        <button type="submit" id="submitBtn" class="submitBtn">Submit</button>
        <p id="message" class="message" aria-live="polite"></p>


    </form>
</div>
<script>
    const userForm = document.getElementById("userForm");

    userForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const userData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
        };

        try {
            const response = await fetch("/api/people", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                },

                body: JSON.stringify(userData),
            });

            const responseText = await response.text();

            console.log("Status:", response.status);
            console.log("Response:", responseText);

            if (!response.ok) {
                throw new Error(`Server error ${response.status}: ${responseText}`);
            }

            const result = JSON.parse(responseText);

            document.getElementById("message").innerText =
                "User created successfully! : " + result.name;

            console.log(result.name)

            userForm.reset();
        } catch (error) {
            console.error("Error:", error);

            document.getElementById("message").innerText = error.message;
        }
    });
</script>

</body>
</html>
